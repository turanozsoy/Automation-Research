<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 340px; margin: 0; padding: 12px; font-size: 13px; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  label { display: block; margin: 8px 0 2px; color: #444; }
  input { width: 100%; padding: 6px; box-sizing: border-box; font-size: 13px; }
  button { padding: 8px 10px; margin-top: 10px; margin-right: 6px; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #site { background: #eef; padding: 6px; border-radius: 4px; word-break: break-all; }
  #status { margin-top: 10px; padding: 8px; border-radius: 4px; background: #f4f4f4; white-space: pre-wrap; min-height: 1.5em; }
  .ok { background: #e6ffe6 !important; } .err { background: #ffe6e6 !important; }
  .small { font-size: 11px; color: #777; margin-top: 8px; }
  a { color: #36c; }
</style>
</head>
<body>
  <h3>Export session to automation</h3>
  <div id="site">checking service…</div>

  <label>Profile label</label>
  <input id="label" placeholder="acct1">
  <label>Account key (email / username, must be unique)</label>
  <input id="account" placeholder="user@example.com">

  <div>
    <button id="btnSend" disabled>Send to service</button>
    <button id="btnDownload" disabled>Download file</button>
  </div>
  <div id="status"></div>
  <div class="small">
    Open a tab on Website B where you are logged in, then press a button.
    Service URL and token: <a href="#" id="openOptions">options</a>.
  </div>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Automation debug harness</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
  label { display: block; margin: 8px 0 2px; font-size: 13px; color: #333; }
  input, select { width: 100%; padding: 6px; font-size: 14px; box-sizing: border-box; }
  button { padding: 8px 14px; font-size: 14px; margin-right: 6px; margin-top: 12px; }
  #status { padding: 8px; background: #eee; margin-bottom: 8px; font-family: monospace; }
  #status b { text-transform: uppercase; }
  #result { padding: 8px; background: #e6ffe6; margin-bottom: 8px; word-break: break-all; min-height: 20px; }
  #log { font-family: monospace; font-size: 12px; white-space: pre-wrap; background: #111; color: #ddd; padding: 8px; height: 75vh; overflow: auto; }
  .err { color: #ff7b7b; } .ack { color: #8fe38f; } .local { color: #9ecbff; } .srv { color: #ddd; } .state { color: #ffd479; }
  .sync { font-size: 11px; color: #777; }
</style>
</head>
<body>
<div>
  <h3>Automation debug harness <small style="font-weight:normal;font-size:12px">· internal · <a href="/admin/accounts">accounts</a></small></h3>
  <div id="status">state: <b id="state">connecting</b> <span id="detail"></span><br><small>workflow: <span id="wfid">—</span> · pool: <span id="pool">?</span></small></div>


  <label>First name <span class="sync" data-sync="firstName"></span></label>
  <input data-field="firstName" autocomplete="off">
  <label>Last name <span class="sync" data-sync="lastName"></span></label>
  <input data-field="lastName" autocomplete="off">
  <label>Date of birth (MM/DD/YYYY) <span class="sync" data-sync="dateOfBirth"></span></label>
  <input data-field="dateOfBirth" placeholder="MM/DD/YYYY" autocomplete="off">
  <label>Mobile number <span class="sync" data-sync="mobileNumber"></span></label>
  <input data-field="mobileNumber" autocomplete="off">
  <label>Address line 1 <span class="sync" data-sync="address1"></span></label>
  <input data-field="address1" autocomplete="off">
  <label>City <span class="sync" data-sync="city"></span></label>
  <input data-field="city" autocomplete="off">
  <label>State <span class="sync" data-sync="state"></span></label>
  <select data-field="state">
    <option value="">— select —</option>
    <option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option><option value="AR">Arkansas</option>
    <option value="CA">California</option><option value="CO">Colorado</option><option value="CT">Connecticut</option><option value="DE">Delaware</option>
    <option value="DC">District of Columbia</option><option value="FL">Florida</option><option value="GA">Georgia</option><option value="HI">Hawaii</option>
    <option value="ID">Idaho</option><option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option>
    <option value="KS">Kansas</option><option value="KY">Kentucky</option><option value="LA">Louisiana</option><option value="ME">Maine</option>
    <option value="MD">Maryland</option><option value="MA">Massachusetts</option><option value="MI">Michigan</option><option value="MN">Minnesota</option>
    <option value="MS">Mississippi</option><option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option>
    <option value="NV">Nevada</option><option value="NH">New Hampshire</option><option value="NJ">New Jersey</option><option value="NM">New Mexico</option>
    <option value="NY">New York</option><option value="NC">North Carolina</option><option value="ND">North Dakota</option><option value="OH">Ohio</option>
    <option value="OK">Oklahoma</option><option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option>
    <option value="SC">South Carolina</option><option value="SD">South Dakota</option><option value="TN">Tennessee</option><option value="TX">Texas</option>
    <option value="UT">Utah</option><option value="VT">Vermont</option><option value="VA">Virginia</option><option value="WA">Washington</option>
    <option value="WV">West Virginia</option><option value="WI">Wisconsin</option><option value="WY">Wyoming</option>
  </select>
  <label>ZIP code <span class="sync" data-sync="zip"></span></label>
  <input data-field="zip" autocomplete="off">
  <label>Authentication code <span class="sync" data-sync="authenticationCode"></span></label>
  <input data-field="authenticationCode" autocomplete="off">

  <div id="pausePanel" style="display:none;background:#fff3cd;border:1px solid #d9a400;padding:8px;margin-top:12px">
    <b>Paused</b> — step <code id="pauseStep"></code> failed: <span id="pauseMsg"></span><br>
    <small>Do the step yourself in the Chromium window if you want, then choose:</small><br>
    <button id="btnRetry">Retry this step</button>
    <button id="btnSkip">I did it manually — continue with next step</button>
    <button id="btnAbort">Abort</button>
    <div id="pauseSteps" style="font-family:monospace;font-size:11px;margin-top:6px"></div>
  </div>
  <div>
    <button id="btnStart" disabled>Start workflow</button>
    <button id="btnSubmit" disabled>Submit (final action)</button>
    <button id="btnEnd" disabled>End workflow</button>
    <button id="btnClear">Clear log</button>
  </div>
  <p style="font-size:12px;color:#666">Debounce: <span id="debounce">?</span> ms · Target: <span id="target">?</span></p>
</div>
<div>
  <h3>Result</h3>
  <div id="result">— no URL yet —</div>
  <h3>Event log</h3>
  <div id="log"></div>
</div>
<script src="/debug.js"></script>
</body>
</html>

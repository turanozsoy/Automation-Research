<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Apply to Shipzora</title>
<!-- Inter (SIL Open Font License). Self-host the same files later if external font requests are not wanted; the system stack in --font is the fallback. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/apply/apply.css">
</head>
<body data-screen="landing">
<a class="skip-link" href="#main">Skip to application</a>

<header class="site-header">
  <div class="shell header-row">
    <!-- Landing: centred "Shipzora Careers". Application steps: back arrow + centred "Shipzora Application". -->
    <button type="button" class="header-back" id="headerBack" aria-label="Back" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H6M12 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="app-title" id="headerContext"><span class="brand-word">Shipzora</span> Careers</p>
  </div>
  <div class="accent-line" aria-hidden="true"><span></span></div>
</header>

<div id="progressWrap" hidden>
  <div class="progress-line">
    <div class="progress-track" role="progressbar" id="progressBar" aria-labelledby="progressLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
  <div class="shell progress-badge-row">
    <p class="step-badge" id="progressLabel"></p>
  </div>
</div>

<main id="main" class="shell main" tabindex="-1">
  <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>
  <div id="screen" class="screen"></div>
</main>

<template id="tpl-spinner">
  <span class="spinner" aria-hidden="true"></span>
</template>

<!--
  Landing hero. To use the approved photo, save it as src/apply/hero.png or src/apply/hero.jpg (portrait, about
  1080 x 1350); it is picked up automatically, no CSS change needed. Until a file exists the dark placeholder
  gradient shows. The gradient overlay and the text sit on top of whatever image is set.
-->
<template id="tpl-hero">
  <section class="hero" aria-label="Drive with Shipzora">
    <div class="hero-media" id="heroImage" role="img" aria-label=""></div>
    <div class="hero-overlay" aria-hidden="true"></div>
    <div class="hero-content">
      <!-- text filled from the applicant content (editable on the operations page) -->
      <span class="hero-pill"></span>
      <h1 class="hero-title"></h1>
      <p class="hero-sub"></p>
    </div>
  </section>
</template>

<script src="/apply/apply.js" defer></script>
</body>
</html>
